openapi: 3.0.3
info:
  title: IBX HTTP API
  version: 1.0.0
  description: |
    The IBX API turns captured thoughts into owner-scoped todos and files,
    with private Cloudflare R2 storage and opt-in public file links.
  contact:
    url: https://ibx.egeuysal.com
servers:
  - url: https://ibx.egeuysal.com
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: auth
    description: Session state, password login, and logout.
  - name: thoughts
    description: Capture, sync, and generate from thoughts.
  - name: todos
    description: List, create, update, and delete todos.
  - name: api-keys
    description: Create and revoke integration keys from a session.
  - name: attachments
    description: Owner-scoped file uploads and visibility, plus public downloads.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: IBX API key
      description: Send the full secret as Authorization Bearer iak_....
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AttachmentContentType:
      type: string
      enum:
        - application/pdf
        - image/gif
        - image/jpeg
        - image/png
        - image/webp
        - text/markdown
        - text/plain
        - audio/mpeg
        - audio/mp3
        - audio/mp4
        - audio/wav
        - audio/x-wav
        - audio/ogg
        - audio/webm
        - video/mp4
        - video/webm
        - video/quicktime
        - video/ogg
        - video/x-m4v
    AttachmentCreateRequest:
      type: object
      required: [uploadToken]
      properties:
        uploadToken:
          type: string
          maxLength: 4000
          description: Short-lived signed ticket returned with the R2 upload URL.
    Attachment:
      type: object
      required: [id, parentKind, parentId, fileName, contentType, size, status, createdAt, updatedAt, url, publicUrl, visibility]
      properties:
        id:
          type: string
        parentKind:
          type: string
          enum: [thought, todo, file]
        parentId:
          type: string
        fileName:
          type: string
          maxLength: 180
        contentType:
          $ref: '#/components/schemas/AttachmentContentType'
        size:
          type: integer
          minimum: 1
          maximum: 31457280
        status:
          type: string
          enum: [uploaded]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        url:
          type: string
          format: uri
          description: Public username/fileName URL, or authenticated /api/attachments/{id}/file fallback when no username exists.
        publicUrl:
          type: string
          format: uri
          nullable: true
          description: Public download URL, or null without a username. Anyone who knows or guesses this URL can download without authentication.
        visibility:
          type: string
          enum: [public, private]
          description: New uploads default to private.
    FileVisibility:
      type: object
      required: [visibility]
      properties:
        visibility:
          type: string
          enum: [public, private]
    Timestamp:
      type: integer
      format: int64
      description: Unix timestamp in milliseconds.
    Thought:
      type: object
      required: [externalId, rawText, createdAt, status, synced, aiRunId]
      properties:
        externalId:
          type: string
          minLength: 16
          maxLength: 64
        rawText:
          type: string
          maxLength: 12000
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum: [pending, processing, done, failed]
        synced:
          type: boolean
        aiRunId:
          type: string
          nullable: true
    Todo:
      type: object
      required:
        - id
        - thoughtId
        - title
        - notes
        - notesJson
        - notesHtml
        - status
        - dueDate
        - estimatedHours
        - timeBlockStart
        - priority
        - recurrence
        - source
        - createdAt
      properties:
        id:
          type: string
        thoughtId:
          type: string
        title:
          type: string
          maxLength: 140
        notes:
          type: string
          nullable: true
          maxLength: 4000
        notesJson:
          nullable: true
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        notesHtml:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, done]
        dueDate:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        estimatedHours:
          type: number
          minimum: 0.25
          maximum: 24
          nullable: true
        timeBlockStart:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        priority:
          type: integer
          enum: [1, 2, 3]
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
        source:
          type: string
          enum: [ai, manual]
        briUrl:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    GenerationPreferences:
      type: object
      properties:
        autoSchedule:
          type: boolean
          default: true
        includeRelevantLinks:
          type: boolean
          default: true
        requireTaskDescriptions:
          type: boolean
          default: true
        availabilityNotes:
          type: string
          maxLength: 640
          nullable: true
        executionSpeedMultiplier:
          type: number
          minimum: 1
          maximum: 8
          default: 4
    GenerateRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
        today:
          type: string
          format: date
          description: Optional date key used for scheduling.
        preferences:
          $ref: '#/components/schemas/GenerationPreferences'
    GenerateResponse:
      type: object
      required: [ok, runId, created, updated, deleted, mode, droppedMutationOps]
      properties:
        ok:
          type: boolean
          enum: [true]
        runId:
          type: string
        created:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        mode:
          type: string
          enum: [create, mutate]
        message:
          type: string
          nullable: true
        droppedMutationOps:
          type: integer
        deduped:
          type: boolean
          description: Present for an already-processed Shortcut capture.
    SyncThought:
      type: object
      required: [externalId, rawText, createdAt, status, aiRunId]
      properties:
        externalId:
          type: string
          minLength: 16
          maxLength: 64
        rawText:
          type: string
          minLength: 1
          maxLength: 12000
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: string
          enum: [pending, processing, done, failed]
        aiRunId:
          type: string
          nullable: true
    TodoCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 140
        notes:
          type: string
          nullable: true
          maxLength: 640
        dueDate:
          type: string
          format: date
          nullable: true
        estimatedHours:
          type: number
          minimum: 0.25
          maximum: 24
          nullable: true
        timeBlockStart:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
          default: none
        priority:
          type: integer
          enum: [1, 2, 3]
          default: 1
        localId:
          type: string
          pattern: '^local-[A-Za-z0-9-]{1,80}$'
          description: Optional offline client identifier.
    TodoPatchRequest:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [open, done]
        title:
          type: string
          minLength: 1
          maxLength: 140
        notes:
          type: string
          nullable: true
          maxLength: 4000
        notesJson:
          nullable: true
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        notesHtml:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        estimatedHours:
          type: number
          minimum: 0.25
          maximum: 24
          nullable: true
        timeBlockStart:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        recurrence:
          type: string
          enum: [none, daily, weekly, monthly]
        priority:
          type: integer
          enum: [1, 2, 3]
    ApiKeyMetadata:
      type: object
      required: [id, name, prefix, last4, permission, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          example: iak
        last4:
          type: string
        permission:
          type: string
          enum: [read, write, both]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ApiKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          default: default
        permission:
          type: string
          enum: [read, write, both]
          default: both
    ApiKeyCreateResponse:
      type: object
      required: [ok, apiKey, key]
      properties:
        ok:
          type: boolean
          enum: [true]
        apiKey:
          type: string
          description: Full secret returned only at creation time.
        key:
          $ref: '#/components/schemas/ApiKeyMetadata'
    AuthState:
      type: object
      required: [authenticated, expiresAt]
      properties:
        authenticated:
          type: boolean
        authType:
          type: string
          enum: [apiKey, clerk, session]
          nullable: true
        permission:
          type: string
          enum: [read, write, both]
          nullable: true
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
  responses:
    BadRequest:
      description: The body, date, enum, or identifier is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session, Clerk credential, or API key was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The request failed the origin check or the API key lacks the required method permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The owner-scoped resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Too many password login attempts.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExternalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    TodoId:
      name: todoId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        maxLength: 96
paths:
  /api/files:
    get:
      tags: [attachments]
      summary: List your files
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 4000
      responses:
        '200':
          description: Owner-scoped page of up to 50 files.
          content:
            application/json:
              schema:
                type: object
                required: [files, cursor, isDone, username]
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
                  cursor:
                    type: string
                    nullable: true
                  isDone:
                    type: boolean
                  username:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/files/{attachmentId}:
    patch:
      tags: [attachments]
      summary: Change file visibility
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileVisibility'
      responses:
        '200':
          description: Visibility updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [attachments]
      summary: Delete a file
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: File deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/attachments/upload-url:
    post:
      tags: [attachments]
      summary: Create a direct-to-R2 upload
      description: |
        Requires write permission. No request body is required. Cookie-authenticated
        writes require a same-origin Origin or Referer.
        Send parentKind, parentId, fileName, contentType, and size. For the
        Files library use parentKind=file and parentId=library. PUT raw bytes
        to the returned R2 URL using its returned headers; never send IBX
        credentials to storage. POST the returned uploadToken to /api/attachments.
      responses:
        '200':
          description: Upload URL and current limits.
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, method, headers, uploadToken, limits]
                properties:
                  uploadUrl:
                    type: string
                    format: uri
                  method:
                    type: string
                    enum: [PUT]
                  headers:
                    type: object
                    required: [Content-Type]
                    properties:
                      Content-Type:
                        type: string
                  uploadToken:
                    type: string
                    maxLength: 4000
                  limits:
                    type: object
                    required: [maxBytes, allowedContentTypes]
                    properties:
                      maxBytes:
                        type: integer
                        enum: [31457280]
                        description: 30 MiB; files must also be nonempty.
                      allowedContentTypes:
                        type: array
                        items:
                          $ref: '#/components/schemas/AttachmentContentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/attachments:
    post:
      tags: [attachments]
      summary: Save attachment
      description: |
        Requires write permission. Complete an R2 upload by sending its signed
        uploadToken. Cookie-authenticated writes require a same-origin Origin
        or Referer. Uploaded size and type are verified against the ticket.
        Names are normalized and suffixed on duplicates, including deleted names.
        Public username/fileName links expose the file without authentication;
        notes and management remain private. Without a username, url uses the
        authenticated /api/attachments/{id}/file fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentCreateRequest'
      responses:
        '200':
          description: Saved attachment and its resolved filename and URL.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, fileName, url, publicUrl, visibility]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  id:
                    type: string
                  fileName:
                    type: string
                  publicUrl:
                    type: string
                    format: uri
                    nullable: true
                  visibility:
                    type: string
                    enum: [public, private]
                  url:
                    type: string
                    format: uri
        '400':
          description: Invalid metadata, inaccessible parent, missing storage file, unsupported type, invalid stored size, or exhausted duplicate names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [attachments]
      summary: List attachments
      description: Requires read permission. Supply parentKind and parentId unless all=true, which ignores parent filters. Newest first; inspects at most 50 records per parent or 100 owner-wide, then filters deleted records. No pagination.
      parameters:
        - name: parentKind
          in: query
          schema:
            type: string
            enum: [thought, todo, file]
        - name: parentId
          in: query
          description: Full todo ID, thought externalId, or library ID; required with parentKind unless all=true.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: all
          in: query
          description: Only the literal query value true enables owner-wide listing.
          schema:
            type: boolean
      responses:
        '200':
          description: Owner-scoped uploaded attachments.
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/attachments/{attachmentId}:
    delete:
      tags: [attachments]
      summary: Delete attachment
      description: Requires write permission. Deletes the owner-scoped attachment and stored bytes; its filename stays reserved. Cookie-authenticated writes require a same-origin Origin or Referer.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Attachment and stored file deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/attachments/{attachmentId}/url:
    get:
      tags: [attachments]
      summary: Get file URL
      description: Requires read permission and ownership. Returns an IBX URL and nullable publicUrl; signed storage credentials are never returned.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Resolved download URL.
          content:
            application/json:
              schema:
                type: object
                required: [url, publicUrl, visibility]
                properties:
                  url:
                    type: string
                    format: uri
                  publicUrl:
                    type: string
                    format: uri
                    nullable: true
                  visibility:
                    type: string
                    enum: [public, private]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/attachments/{attachmentId}/file:
    get:
      tags: [attachments]
      summary: Get file
      description: Requires read permission and ownership. Streams file bytes inline with private, no-store caching and nosniff; it does not expose or redirect to storage credentials.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: File bytes when no username exists; Content-Type is taken from storage.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Storage file could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /{username}/{fileName}:
    get:
      tags: [attachments]
      summary: Get public file
      security: []
      description: |
        No authentication required. Anyone who knows or guesses the URL can download.
        Resolves the username's owner and normalized filename, not the viewer's session.
        Streams inline with private, no-store caching, nosniff, wildcard CORS, and noindex,
        nofollow (not access control). Forwards Range and If-Range to storage and
        preserves Content-Range, Accept-Ranges, ETag, Last-Modified,
        Content-Type, and storage status, supporting audio/video seeking.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 180
        - name: fileName
          in: path
          required: true
          description: Use the returned normalized filename, including any duplicate suffix. Path segments cannot contain slashes, backslashes, or control characters.
          schema:
            type: string
            minLength: 1
            maxLength: 180
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-1023
        - name: If-Range
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Full file bytes; Content-Type is taken from storage.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial file bytes from storage.
          headers:
            Content-Range:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Requested range is not satisfiable; status, body, and Content-Range are forwarded from storage.
          headers:
            Content-Range:
              schema:
                type: string
        '502':
          description: Storage file could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/session:
    get:
      tags: [auth]
      summary: Check session
      description: Return authentication state without failing unauthenticated callers.
      security: []
      responses:
        '200':
          description: Current authentication state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthState'
  /api/login:
    post:
      tags: [auth]
      summary: Start password session
      description: Authenticate with the configured app password and set the ibx_session cookie. Login is rate limited per client address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/logout:
    post:
      tags: [auth]
      summary: End session
      description: Revoke the current legacy session and clear session and browser API-key cookies.
      security: []
      responses:
        '200':
          description: Session cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/api-keys:
    get:
      tags: [api-keys]
      summary: List API keys
      description: List active key metadata for a signed-in session or Clerk user. Bearer API keys cannot list or create keys.
      security: []
      responses:
        '200':
          description: Active key metadata.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyMetadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [api-keys]
      summary: Create API key
      description: Create an API key from a signed-in session or Clerk user. The raw apiKey is returned once.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '200':
          description: Key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/api-keys/{keyId}:
    delete:
      tags: [api-keys]
      summary: Revoke API key
      description: Revoke an owner-scoped API key.
      security: []
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/thoughts:
    get:
      tags: [thoughts]
      summary: List thoughts
      description: List owner-scoped thought records.
      responses:
        '200':
          description: Thought records.
          content:
            application/json:
              schema:
                type: object
                required: [thoughts]
                properties:
                  thoughts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Thought'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/thoughts/sync:
    post:
      tags: [thoughts]
      summary: Sync thoughts
      description: Upsert valid client thoughts for offline-first clients. Invalid entries are discarded before the response is built.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thoughts]
              properties:
                thoughts:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyncThought'
      responses:
        '200':
          description: Synced owner thoughts.
          content:
            application/json:
              schema:
                type: object
                required: [thoughts]
                properties:
                  thoughts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Thought'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/thoughts/{externalId}/todos:
    get:
      tags: [thoughts]
      summary: List thought todos
      description: List todos attached to one client externalId. An unknown thought returns an empty todos array.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
        - name: today
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Thought todos.
          content:
            application/json:
              schema:
                type: object
                required: [todos]
                properties:
                  todos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [thoughts]
      summary: Add thought todo
      description: Add one manual todo under an existing thought.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
      responses:
        '200':
          description: Todo created.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/thoughts/{externalId}/generate:
    post:
      tags: [thoughts]
      summary: Generate thought todos
      description: Run the AI planner for an existing thought and reconcile its todos.
      parameters:
        - $ref: '#/components/parameters/ExternalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                today:
                  type: string
                  format: date
                preferences:
                  $ref: '#/components/schemas/GenerationPreferences'
      responses:
        '200':
          description: Generation completed.
          content:
            application/json:
              schema:
                type: object
                required: [ok, created]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  created:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: AI generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/todos:
    get:
      tags: [todos]
      summary: List todos
      description: List all owner-scoped todos and attach Bri publication URLs when available.
      parameters:
        - name: today
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Optional day boundary used for due-date enforcement.
      responses:
        '200':
          description: Todo records.
          content:
            application/json:
              schema:
                type: object
                required: [todos]
                properties:
                  todos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [todos]
      summary: Create todo
      description: Create a manual todo and a corresponding completed thought record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoCreateRequest'
      responses:
        '200':
          description: Todo identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, thoughtId]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  id:
                    type: string
                  thoughtId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/todos/generate:
    post:
      tags: [todos]
      summary: Generate todos
      description: Turn raw text into todos and reconcile matching owner-scoped work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: Generation and reconciliation counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: AI generation or persistence failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/todos/{todoId}:
    get:
      tags: [todos]
      summary: Get todo
      description: Read one owner-scoped todo.
      parameters:
        - $ref: '#/components/parameters/TodoId'
      responses:
        '200':
          description: Todo record.
          content:
            application/json:
              schema:
                type: object
                required: [todo]
                properties:
                  todo:
                    $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [todos]
      summary: Update todo
      description: Update one or more fields and resync its time-block reminder.
      parameters:
        - $ref: '#/components/parameters/TodoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoPatchRequest'
      responses:
        '200':
          description: Todo updated.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [todos]
      summary: Delete todo
      description: Permanently delete one owner-scoped todo and cancel its reminder.
      parameters:
        - $ref: '#/components/parameters/TodoId'
      responses:
        '200':
          description: Todo deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
