name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to release (blank bumps the patch version)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Resolve version and build release asset
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current="$(node -e "const v=require('./cli/package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v)) process.exit(1); process.stdout.write(v)")"
          requested="${REQUESTED_VERSION:-}"
          if [ -n "${requested}" ]; then
            [[ "${requested}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid semver: ${requested}" >&2; exit 1; }
            version="${requested}"
            tag="v${version}"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && { echo "tag already exists: ${tag}" >&2; exit 1; } || true
          else
            IFS=. read -r major minor patch <<<"${current}"
            patch="$((patch + 1))"
            version="${major}.${minor}.${patch}"
            tag="v${version}"
            while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; do
              patch="$((patch + 1))"
              version="${major}.${minor}.${patch}"
              tag="v${version}"
            done
          fi

          node - "${version}" <<'NODE'
          const fs = require("fs");
          const version = process.argv[2];
          const packagePath = "cli/package.json";
          const constantsPath = "cli/src/core/constants.ts";
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          pkg.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          const constants = fs.readFileSync(constantsPath, "utf8");
          fs.writeFileSync(constantsPath, constants.replace(/export const VERSION = ".*?";/, `export const VERSION = "${version}";`));
          NODE

          bun run cli:build
          bun run cli:bundle
          [ "$(node public/ibx --version)" = "${version}" ]
          mkdir -p dist
          cp public/ibx dist/ibx
          (cd dist && sha256sum ibx > SHA256SUMS)

          git add cli/package.json cli/src/core/constants.ts public/ibx public/ibx-version.json
          git commit -m "chore(cli): release ${version}"
          git tag "${tag}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ibx ${{ steps.release.outputs.tag }}" \
            --generate-notes
